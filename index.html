<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Offer</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

img{
    width:100%;
    border-radius:10px;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

.progress-box{
    width:100%;
    background:#ddd;
    height:25px;
    border-radius:20px;
    margin:15px 0;
}

.progress{
    width:0%;
    height:100%;
    background:#28a745;
    border-radius:20px;
    color:white;
    line-height:25px;
}
</style>
</head>
<body>

<div class="container">

<img src="https://via.placeholder.com/400x200" alt="Offer">

<h2>🎁 Special Offer</h2>
<p>ধাপগুলো সম্পন্ন করতে নিচের বাটনে ক্লিক করুন</p>

<div class="progress-box">
    <div class="progress" id="progress">0%</div>
</div>

<button id="clickBtn">Click Here</button>

<div id="shareSection" style="display:none;margin-top:20px;">
    <h3>✅ 100% Complete</h3>

    <button onclick="shareNow()">Share</button>
</div>

<div id="formSection" style="display:none;margin-top:20px;">
    <h3>🎉 Congratulations!</h3>

    <input type="text" placeholder="bKash Number"
    style="padding:10px;width:90%;"><br><br>

    <button>Submit</button>
</div>

</div>

<script>

let count = 0;

const levels = [10,25,50,75,100];

document.getElementById("clickBtn").onclick = function(){

    document.getElementById("clickBtn").onclick = function(){
        window.open("https://www.effectivecpmnetwork.com/qsar22rk2?key=77c72e945381ef1a5c475b9a5f65d12b","_blank");

        if(count < 5){
            let value = levels[count];

            document.getElementById("progress").style.width = value + "%";
            document.getElementById("progress").innerHTML = value + "%";

            count++;

            if(count == 5){
                document.getElementById("clickBtn").style.display="none";
                document.getElementById("shareSection").style.display="block";
            }
        }
    }
}

function shareNow(){

    document.getElementById("shareSection").style.display="none";
    document.getElementById("formSection").style.display="block";

}

</script>

</body>
</html>
